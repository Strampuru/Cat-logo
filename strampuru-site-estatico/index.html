ragrafos:["Este website funciona como cat\xE1logo de apresenta\xE7\xE3o de produtos. As encomendas n\xE3o s\xE3o feitas no site: s\xE3o formalizadas diretamente por mensagem no WhatsApp, no Instagram ou por email.","Ap\xF3s o pedido do cliente, o Vendedor confirma por escrito a disponibilidade, a personaliza\xE7\xE3o acordada, o valor total (incluindo portes de envio), os prazos estimados de produ\xE7\xE3o e entrega e os dados para pagamento. A encomenda considera-se aceite com essa confirma\xE7\xE3o e s\xF3 entra em produ\xE7\xE3o depois de confirmado o pagamento.","Sempre que a personaliza\xE7\xE3o o justifique, o Vendedor envia uma prova (maquete) para aprova\xE7\xE3o. A produ\xE7\xE3o s\xF3 come\xE7a depois de o cliente aprovar a prova."]},{titulo:"3. Pre\xE7os, pagamento e portes de envio",paragrafos:["Os pre\xE7os apresentados no cat\xE1logo est\xE3o em euros (\u20AC), s\xE3o por unidade, incluem a personaliza\xE7\xE3o e incluem IVA \xE0 taxa legal em vigor. Os pre\xE7os variam consoante a quantidade encomendada, de acordo com os escal\xF5es indicados em cada produto.","Os portes de envio n\xE3o est\xE3o inclu\xEDdos nos pre\xE7os e s\xE3o comunicados ao cliente antes da confirma\xE7\xE3o da encomenda.","As promo\xE7\xF5es indicadas no site (por exemplo, \xAB\u221210% esta semana\xBB) s\xE3o v\xE1lidas apenas durante o per\xEDodo indicado e aplicam-se \xE0s encomendas confirmadas dentro desse per\xEDodo.","Os meios de pagamento dispon\xEDveis e os respetivos dados s\xE3o indicados na confirma\xE7\xE3o da encomenda. Por cada pagamento \xE9 emitida a respetiva fatura ou fatura-recibo."]},{titulo:"4. Prazos de produ\xE7\xE3o e entrega",paragrafos:["Os prazos de produ\xE7\xE3o e entrega s\xE3o estimados e comunicados na confirma\xE7\xE3o de cada encomenda, dependendo da quantidade, do tipo de personaliza\xE7\xE3o e da disponibilidade dos artigos.","Em caso de atraso, o Vendedor informa o cliente logo que poss\xEDvel. Na falta de indica\xE7\xE3o de prazo, a entrega \xE9 feita no m\xE1ximo em 30 dias ap\xF3s a celebra\xE7\xE3o do contrato, nos termos da lei."]},{titulo:"5. Produtos personalizados e direito de livre resolu\xE7\xE3o",paragrafos:["Nos termos do artigo 17.\xBA, n.\xBA 1, al\xEDnea c), do Decreto-Lei n.\xBA 24/2014, n\xE3o existe direito de livre resolu\xE7\xE3o (devolu\xE7\xE3o no prazo de 14 dias sem indicar motivo) no fornecimento de bens confecionados de acordo com especifica\xE7\xF5es do consumidor ou manifestamente personalizados.","Assim, depois de o cliente aprovar a personaliza\xE7\xE3o e de a produ\xE7\xE3o come\xE7ar, n\xE3o s\xE3o aceites cancelamentos, trocas ou devolu\xE7\xF5es por mudan\xE7a de ideia (por exemplo, escolha errada de tamanho ou cor).","Se for vendido algum artigo sem personaliza\xE7\xE3o, o consumidor mant\xE9m o direito de livre resolu\xE7\xE3o de 14 dias a contar da rece\xE7\xE3o, devendo devolver o artigo em perfeito estado; os custos de devolu\xE7\xE3o ficam a cargo do cliente."]},{titulo:"6. Defeitos, erros de personaliza\xE7\xE3o e garantia",paragrafos:["Todos os artigos beneficiam da garantia legal de conformidade prevista no Decreto-Lei n.\xBA 84/2021 (3 anos para os consumidores).","Se o artigo tiver defeito de fabrico ou erro de personaliza\xE7\xE3o imput\xE1vel ao Vendedor, pedimos que nos contacte logo que poss\xEDvel, de prefer\xEAncia nas 48 horas seguintes \xE0 rece\xE7\xE3o, enviando fotografias do artigo. Procederemos \xE0 repara\xE7\xE3o, substitui\xE7\xE3o ou reembolso sem custos para o cliente. Este pedido de rapidez serve apenas para resolvermos o problema mais depressa e n\xE3o limita os seus direitos de garantia legal.","N\xE3o s\xE3o considerados defeitos as pequenas varia\xE7\xF5es de cor entre o ecr\xE3 e o artigo real, nem os resultados que correspondam exatamente \xE0 prova aprovada pelo cliente."]},{titulo:"7. Direitos sobre imagens, log\xF3tipos e textos enviados",paragrafos:["O cliente declara que \xE9 titular dos direitos, ou que tem as autoriza\xE7\xF5es necess\xE1rias, sobre as imagens, log\xF3tipos, marcas ou textos que envia para personaliza\xE7\xE3o, e assume a responsabilidade por qualquer viola\xE7\xE3o de direitos de propriedade intelectual de terceiros.","O Vendedor pode recusar personaliza\xE7\xF5es com conte\xFAdo ilegal, ofensivo ou que viole direitos de terceiros.","As fotografias de trabalhos realizados s\xF3 s\xE3o publicadas pelo Vendedor com autoriza\xE7\xE3o do cliente e com as caras das pessoas desfocadas."]},{titulo:"8. Reclama\xE7\xF5es e resolu\xE7\xE3o de lit\xEDgios",paragrafos:[`O cliente pode apresentar reclama\xE7\xE3o diretamente ao Vendedor (${X$.email}) ou no Livro de Reclama\xE7\xF5es Eletr\xF3nico (www.livroreclamacoes.pt).`,`Em caso de lit\xEDgio de consumo, o consumidor pode recorrer a uma entidade de Resolu\xE7\xE3o Alternativa de Lit\xEDgios de Consumo: ${SU.nome} \u2014 ${SU.site} \xB7 ${SU.email}. Mais informa\xE7\xF5es no Portal do Consumidor: ${M8}.`]},{titulo:"9. Aceita\xE7\xE3o e conhecimento dos termos",paragrafos:["Ao aceitar estes Termos e Condi\xE7\xF5es e a Pol\xEDtica de Privacidade (na entrada do site ou ao fazer uma encomenda), o cliente declara que os leu, compreendeu e aceita na \xEDntegra. A partir desse momento, o cliente n\xE3o pode alegar desconhecimento ou ignor\xE2ncia do seu conte\xFAdo.","Os Termos e Condi\xE7\xF5es e a Pol\xEDtica de Privacidade est\xE3o sempre dispon\xEDveis para consulta no rodap\xE9 de todas as p\xE1ginas do site. Em caso de d\xFAvida, o cliente deve contactar o Vendedor antes de confirmar a encomenda.","O disposto neste ponto n\xE3o afasta nem limita os direitos que a lei garante aos consumidores."]},{titulo:"10. Lei aplic\xE1vel",paragrafos:["Estes Termos e Condi\xE7\xF5es regem-se pela lei portuguesa. O Vendedor pode atualiz\xE1-los; aplica-se a cada encomenda a vers\xE3o em vigor na data da sua confirma\xE7\xE3o."]}]},{id:"privacidade",nome:"Pol\xEDtica de Privacidade",titulo:"Pol\xEDtica de Privacidade",introducao:"Explicamos de forma simples que dados tratamos, para qu\xEA e quais s\xE3o os seus direitos, de acordo com o Regulamento Geral sobre a Prote\xE7\xE3o de Dados (RGPD).",seccoes:[{titulo:"1. Respons\xE1vel pelo tratamento",paragrafos:[`O respons\xE1vel pelo tratamento dos dados pessoais \xE9 ${X$.nome} (${X$.marca}), NIF ${X$.nif}, com domic\xEDlio em ${X$.morada}, contact\xE1vel atrav\xE9s de ${X$.email}.`]},{titulo:"2. Dados recolhidos e finalidades",paragrafos:["Este website n\xE3o tem formul\xE1rios nem contas de cliente e n\xE3o utiliza cookies de publicidade ou de rastreamento.","Quando nos contacta pelo WhatsApp, Instagram ou email para fazer uma encomenda, tratamos apenas os dados necess\xE1rios para: (a) responder ao seu pedido e preparar o or\xE7amento; (b) produzir, personalizar e enviar a encomenda (nome, contacto, morada de entrega e elementos de personaliza\xE7\xE3o); (c) cumprir obriga\xE7\xF5es legais e fiscais (emiss\xE3o de faturas, com NIF quando indicado)."]},{titulo:"3. Fundamento legal",paragrafos:["Os dados s\xE3o tratados para a execu\xE7\xE3o do contrato de compra e venda e das dilig\xEAncias pr\xE9-contratuais pedidas por si (artigo 6.\xBA, n.\xBA 1, al\xEDnea b), do RGPD) e para o cumprimento de obriga\xE7\xF5es legais (al\xEDnea c))."]},{titulo:"4. Conserva\xE7\xE3o",paragrafos:["Os dados das encomendas s\xE3o conservados enquanto forem necess\xE1rios para a encomenda e para eventuais garantias. Os documentos fiscais s\xE3o guardados pelo prazo legal (atualmente 10 anos). As conversas de pedidos que n\xE3o resultem em encomenda s\xE3o apagadas quando deixarem de ser necess\xE1rias."]},{titulo:"5. Partilha com terceiros",paragrafos:["N\xE3o vendemos nem cedemos os seus dados. Podem ter acesso a dados, apenas na medida do necess\xE1rio: as transportadoras (para a entrega), o contabilista (para obriga\xE7\xF5es fiscais) e os fornecedores dos servi\xE7os que usa para falar connosco (WhatsApp/Instagram \u2013 Meta; email \u2013 Google).","O site est\xE1 alojado no GitHub Pages, usa o Cloudflare Web Analytics para contar visitas de forma agregada e an\xF3nima (sem cookies e sem identificar visitantes) e carrega os tipos de letra a partir do Google Fonts. Estes servi\xE7os podem tratar dados t\xE9cnicos, como o endere\xE7o IP, apenas para entregar o site e contar visitas."]},{titulo:"6. Os seus direitos",paragrafos:[`Pode pedir a qualquer momento o acesso, a retifica\xE7\xE3o, o apagamento ou a portabilidade dos seus dados, bem como a limita\xE7\xE3o ou a oposi\xE7\xE3o ao tratamento, escrevendo para ${X$.email}.`,"Tem ainda o direito de apresentar reclama\xE7\xE3o \xE0 Comiss\xE3o Nacional de Prote\xE7\xE3o de Dados (CNPD \u2013 www.cnpd.pt)."]},{titulo:"7. Cookies e armazenamento no navegador",paragrafos:["O site n\xE3o usa cookies. Guarda apenas no seu navegador pequenas prefer\xEAncias t\xE9cnicas necess\xE1rias ao funcionamento (por exemplo, que j\xE1 aceitou estes termos ou que fechou o aviso \xABEncomende j\xE1\xBB). Estes dados n\xE3o saem do seu dispositivo e pode apag\xE1-los nas defini\xE7\xF5es do navegador."]},{titulo:"8. Aceita\xE7\xE3o",paragrafos:["Ao aceitar esta Pol\xEDtica de Privacidade (na entrada do site ou ao fazer uma encomenda), declara que a leu e compreendeu, n\xE3o podendo a partir desse momento alegar desconhecimento do seu conte\xFAdo. Esta pol\xEDtica est\xE1 sempre dispon\xEDvel no rodap\xE9 do site."]}]},{id:"litigios",nome:"Resolu\xE7\xE3o de Lit\xEDgios",titulo:"Reclama\xE7\xF5es e Resolu\xE7\xE3o de Lit\xEDgios",introducao:"Se alguma coisa n\xE3o correr bem, fale primeiro connosco \u2014 resolvemos a maioria das situa\xE7\xF5es rapidamente.",seccoes:[{titulo:"Livro de Reclama\xE7\xF5es Eletr\xF3nico",paragrafos:["Pode apresentar uma reclama\xE7\xE3o no Livro de Reclama\xE7\xF5es Eletr\xF3nico, em www.livroreclamacoes.pt."]},{titulo:"Resolu\xE7\xE3o Alternativa de Lit\xEDgios (RAL)",paragrafos:[`Em caso de lit\xEDgio de consumo, o consumidor pode recorrer \xE0 seguinte Entidade de Resolu\
